<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>יוצר תמונה</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    margin: 0;
    padding: 0;
    background: #f5f5f5;
    color: #333;
    direction: rtl;
    text-align: right;
  }
  .container {
    max-width: 480px;
    margin: auto;
    padding: 1rem;
  }
  h1 {
    text-align: center;
    font-size: 1.8rem;
    margin-bottom: 1rem;
  }
  .field {
    margin-bottom: 0.8rem;
  }
  .field label {
    display: block;
    margin-bottom: 0.3rem;
    font-weight: bold;
  }
  .field input[type="text"],
  .field input[type="color"],
  .field input[type="number"] {
    width: 100%;
    padding: 0.5rem;
    font-size: 1rem;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  .buttons {
    display: flex;
    gap: 0.5rem;
    margin-top: 1rem;
  }
  .buttons button {
    flex: 1;
    padding: 0.6rem;
    font-size: 1rem;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    background: #0066cc;
    color: #fff;
  }
  .buttons button:hover {
    background: #0055aa;
  }
  canvas {
    width: 100%;
    height: auto;
    margin-top: 1rem;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fff;
  }
</style>
</head>
<body>
<div class="container">
  <h1>יוצר תמונה</h1>
  <div class="field">
    <label for="text">טקסט לתמונה</label>
    <input type="text" id="text" placeholder="הכנס טקסט כאן" />
  </div>
  <div class="field">
    <label for="fontSize">גודל גופן (px)</label>
    <input type="number" id="fontSize" value="48" min="10" max="200" />
  </div>
  <div class="field">
    <label for="textColor">צבע טקסט</label>
    <input type="color" id="textColor" value="#000000" />
  </div>
  <div class="field">
    <label for="bgColor">צבע רקע</label>
    <input type="color" id="bgColor" value="#ffffff" />
  </div>
  <div class="buttons">
    <button id="generateBtn">צור תמונה</button>
    <button id="downloadBtn">הורד PNG</button>
  </div>
  <canvas id="canvas" width="400" height="300"></canvas>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const textInput = document.getElementById('text');
  const fontSizeInput = document.getElementById('fontSize');
  const textColorInput = document.getElementById('textColor');
  const bgColorInput = document.getElementById('bgColor');
  const generateBtn = document.getElementById('generateBtn');
  const downloadBtn = document.getElementById('downloadBtn');

  function drawImage() {
    const text = textInput.value || '';
    const fontSize = parseInt(fontSizeInput.value, 10) || 48;
    const textColor = textColorInput.value;
    const bgColor = bgColorInput.value;

    // Clear canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Fill background
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Set text style
    ctx.fillStyle = textColor;
    ctx.font = `${fontSize}px Arial`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    // Wrap text if needed
    const maxWidth = canvas.width * 0.9;
    const lines = wrapText(ctx, text, maxWidth);
    const lineHeight = fontSize * 1.2;
    const startY = (canvas.height - lines.length * lineHeight) / 2 + lineHeight / 2;

    lines.forEach((line, i) => {
      ctx.fillText(line, canvas.width / 2, startY + i * lineHeight);
    });
  }

  function wrapText(context, text, maxWidth) {
    const words = text.split(' ');
    const lines = [];
    let current = '';
    for (let w of words) {
      const test = current ? current + ' ' + w : w;
      const metrics = context.measureText(test);
      if (metrics.width > maxWidth && current) {
        lines.push(current);
        current = w;
      } else {
        current = test;
      }
    }
    if (current) lines.push(current);
    return lines;
  }

  generateBtn.addEventListener('click', drawImage);

  downloadBtn.addEventListener('click', () => {
    const link = document.createElement('a');
    link.download = 'image.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });

  // Initial draw
  drawImage();
</script>
</body>
</html>
