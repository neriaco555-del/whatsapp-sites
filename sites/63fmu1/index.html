<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>משחק סנייק</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f0f4f8;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            direction: rtl;
        }
        h1 {
            margin-top: 1rem;
            font-size: 1.8rem;
        }
        #gameContainer {
            position: relative;
            margin-top: 1rem;
            width: 100%;
            max-width: 400px;
            background: #fff;
            border: 2px solid #4a90e2;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            background: #e0e7ef;
        }
        #startBtn {
            margin: 1rem;
            padding: 0.6rem 1.2rem;
            font-size: 1rem;
            background: #4a90e2;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #score {
            margin-top: 0.5rem;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <h1>סנייק 🎮</h1>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>
    <button id="startBtn">התחל משחק</button>
    <div id="score">נקודות: 0</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const scoreEl = document.getElementById('score');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{x:10, y:10}];
        let food = {x:0, y:0};
        let velocity = {x:0, y:0};
        let score = 0;
        let gameInterval;

        function resetGame() {
            snake = [{x:10, y:10}];
            velocity = {x:0, y:0};
            score = 0;
            placeFood();
            scoreEl.textContent = 'נקודות: 0';
        }

        function placeFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            // Ensure food not on snake
            while (snake.some(seg => seg.x === food.x && seg.y === food.y)) {
                food.x = Math.floor(Math.random() * tileCount);
                food.y = Math.floor(Math.random() * tileCount);
            }
        }

        function gameLoop() {
            // Move snake
            const head = {x: snake[0].x + velocity.x, y: snake[0].y + velocity.y};

            // Wall collision (wrap)
            head.x = (head.x + tileCount) % tileCount;
            head.y = (head.y + tileCount) % tileCount;

            // Self collision
            if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                clearInterval(gameInterval);
                alert('התפרצת! ניקוד סופי: ' + score);
                startBtn.disabled = false;
                return;
            }

            snake.unshift(head);

            // Food check
            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreEl.textContent = 'נקודות: ' + score;
                placeFood();
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            ctx.fillStyle = '#e0e7ef';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw food
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);

            // Draw snake
            ctx.fillStyle = '#4a90e2';
            snake.forEach((seg, idx) => {
                ctx.fillRect(seg.x * gridSize, seg.y * gridSize, gridSize, gridSize);
            });
        }

        function changeDirection(e) {
            const key = e.key;
            if (key === 'ArrowUp' && velocity.y !== 1) {
                velocity = {x:0, y:-1};
            } else if (key === 'ArrowDown' && velocity.y !== -1) {
                velocity = {x:0, y:1};
            } else if (key === 'ArrowLeft' && velocity.x !== 1) {
                velocity = {x:-1, y:0};
            } else if (key === 'ArrowRight' && velocity.x !== -1) {
                velocity = {x:1, y:0};
            }
        }

        startBtn.addEventListener('click', () => {
            resetGame();
            startBtn.disabled = true;
            document.addEventListener('keydown', changeDirection);
            gameInterval = setInterval(gameLoop, 100);
        });
    </script>
</body>
</html>
