<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>בוט WhatsApp</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body{font-family:Arial,Helvetica,sans-serif;background:#f5f5f5;margin:0;padding:0;display:flex;flex-direction:column;height:100vh;}
  header{background:#25D366;color:#fff;padding:1rem;text-align:center;font-size:1.2rem;}
  #chat{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:0.5rem;}
  .msg{max-width:80%;padding:0.6rem 1rem;border-radius:1rem;word-wrap:break-word;}
  .user{align-self:flex-end;background:#dcf8c6;color:#000;}
  .bot{align-self:flex-start;background:#fff;color:#000;border:1px solid #ddd;}
  #inputBar{display:flex;padding:0.5rem;background:#fff;border-top:1px solid #ccc;}
  #msgInput{flex:1;padding:0.5rem;border:1px solid #ccc;border-radius:0.5rem;margin-right:0.5rem;}
  #sendBtn{background:#25D366;color:#fff;border:none;padding:0.5rem 1rem;border-radius:0.5rem;cursor:pointer;}
  #waLink{margin:0.5rem;text-align:center;}
  #waLink a{color:#25D366;font-weight:bold;text-decoration:none;}
  @media (max-width:600px){
    header{font-size:1rem;}
    #msgInput{font-size:0.9rem;}
    #sendBtn{font-size:0.9rem;}
  }
</style>
</head>
<body>
<header>בוט תמיכה – WhatsApp</header>
<div id="chat"></div>
<div id="inputBar">
  <input type="text" id="msgInput" placeholder="הקלד הודעה..." autocomplete="off">
  <button id="sendBtn">שלח</button>
</div>
<div id="waLink">
  <a href="https://wa.me/1234567890" target="_blank">💬 פנה אלינו ב‑WhatsApp</a>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('msgInput');
const sendBtn = document.getElementById('sendBtn');

const botReplies = {
  "שלום": "היי! איך אפשר לעזור?",
  "מה השעה": () => new Date().toLocaleTimeString('he-IL'),
  "תודה": "בכיף! 😊",
  "היי": "היי! איך אפשר לעזור?"
};

function addMessage(text, fromUser){
  const div = document.createElement('div');
  div.className = 'msg '+(fromUser?'user':'bot');
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function getBotReply(msg){
  const key = Object.keys(botReplies).find(k=>msg.includes(k));
  if(key){
    const reply = botReplies[key];
    return typeof reply==='function'?reply():reply;
  }
  return "מצטער, לא הבנתי. אפשר לכתוב לי שוב?";
}

sendBtn.addEventListener('click',()=>{sendMessage();});
input.addEventListener('keypress',e=>{if(e.key==='Enter') sendMessage();});

function sendMessage(){
  const txt = input.value.trim();
  if(!txt) return;
  addMessage(txt,true);
  input.value='';
  setTimeout(()=>{addMessage(getBotReply(txt),false);},500);
}
</script>
</body>
</html>
