<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>ערוץ הופ - סרטונים חדשים</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f9f9f9;color:#333;}
  header{background:#4a90e2;color:#fff;padding:1rem;text-align:center;}
  h1{margin:0;font-size:1.8rem;}
  .container{padding:1rem;}
  .videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1rem;}
  .video{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
  .video img{width:100%;display:block;}
  .video h3{margin:0.5rem;font-size:1rem;padding:0 0.5rem;}
  .subscribe{margin-top:2rem;background:#fff;padding:1rem;border-radius:8px;box-shadow:0 2px 5px rgba(0,0,0,0.1);}
  .subscribe input[type=email]{width:100%;padding:0.5rem;margin-bottom:0.5rem;border:1px solid #ccc;border-radius:4px;}
  .subscribe button{width:100%;padding:0.5rem;background:#4a90e2;color:#fff;border:none;border-radius:4px;cursor:pointer;}
  footer{background:#333;color:#ddd;padding:1rem;text-align:center;font-size:0.9rem;}
  @media(max-width:600px){
    h1{font-size:1.5rem;}
  }
</style>
</head>
<body>
<header>
  <h1>ערוץ הופ 🎬</h1>
  <p>הסרטונים החמים ביותר מהקולנוע והטלוויזיה</p>
</header>
<div class="container">
  <section class="videos" id="videoList">
    <!-- דוגמאות סרטונים -->
    <div class="video" data-url="https://www.youtube.com/embed/dQw4w9WgXcQ">
      <img src="https://img.youtube.com/vi/dQw4w9WgXcQ/mqdefault.jpg" alt="סרטון 1">
      <h3>סרטון 1</h3>
    </div>
    <div class="video" data-url="https://www.youtube.com/embed/3JZ_D3ELwOQ">
      <img src="https://img.youtube.com/vi/3JZ_D3ELwOQ/mqdefault.jpg" alt="סרטון 2">
      <h3>סרטון 2</h3>
    </div>
    <div class="video" data-url="https://www.youtube.com/embed/L_jWHffIx5E">
      <img src="https://img.youtube.com/vi/L_jWHffIx5E/mqdefault.jpg" alt="סרטון 3">
      <h3>סרטון 3</h3>
    </div>
  </section>

  <section class="subscribe">
    <h2>הצטרפו לניוזלטר 📧</h2>
    <input type="email" id="email" placeholder="הכנסו כתובת אימייל">
    <button onclick="subscribe()">הרשמה</button>
    <p id="msg" style="color:#4a90e2;margin-top:0.5rem;"></p>
  </section>
</div>

<footer>
  © 2026 ערוץ הופ | כל הזכויות שמורות
</footer>

<!-- מודל וידאו -->
<div id="modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);justify-content:center;align-items:center;">
  <iframe id="player" width="90%" height="50%" src="" frameborder="0" allowfullscreen></iframe>
  <button onclick="closeModal()" style="position:absolute;top:10px;right:10px;background:#fff;border:none;padding:0.5rem;border-radius:4px;cursor:pointer;">✖</button>
</div>

<script>
function subscribe(){
  const email=document.getElementById('email').value;
  const msg=document.getElementById('msg');
  if(email && email.includes('@')){
    msg.textContent='תודה שנרשמתם!';
    email.value='';
  }else{
    msg.textContent='נא להזין כתובת אימייל תקינה.';
  }
}
document.querySelectorAll('.video').forEach(v=>{
  v.addEventListener('click',()=>{
    const url=v.dataset.url;
    document.getElementById('player').src=url+'?autoplay=1';
    document.getElementById('modal').style.display='flex';
  });
});
function closeModal(){
  document.getElementById('player').src='';
  document.getElementById('modal').style.display='none';
}
</script>
</body>
</html>
