<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>סט דתי מזרחית 2021</title>
    <style>
        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: #f5f5f5;
            color: #333;
            direction: rtl;
        }
        header {
            background: #4a90e2;
            color: #fff;
            padding: 1rem;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 1.5rem;
        }
        .container {
            padding: 1rem;
            max-width: 800px;
            margin: auto;
        }
        .search-box {
            margin-bottom: 1rem;
            display: flex;
        }
        .search-box input {
            flex: 1;
            padding: .5rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,.1);
            display: flex;
            flex-direction: column;
        }
        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
        }
        .card-body {
            flex: 1;
            padding: .75rem;
        }
        .card-body h3 {
            margin: 0 0 .5rem;
            font-size: 1.1rem;
        }
        .card-body p {
            margin: 0 0 1rem;
            font-size: .9rem;
            color: #666;
        }
        .card-body a {
            display: inline-block;
            padding: .5rem 1rem;
            background: #4a90e2;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-size: .9rem;
        }
        @media (max-width: 600px) {
            header h1 { font-size: 1.2rem; }
        }
    </style>
</head>
<body>
    <header>
        <h1>סט דתי מזרחית 2021 🎶</h1>
    </header>
    <div class="container">
        <div class="search-box">
            <input type="text" id="search" placeholder="חיפוש...">
        </div>
        <div class="cards" id="cards">
            <!-- Card template -->
            <div class="card" data-title="שיר 1">
                <img src="https://via.placeholder.com/300x140?text=שיר+1" alt="שיר 1">
                <div class="card-body">
                    <h3>שיר 1</h3>
                    <p>שיר דתי מזרחי פופולרי משנת 2021.</p>
                    <a href="https://www.youtube.com/watch?v=example1" target="_blank">האזנה</a>
                </div>
            </div>
            <div class="card" data-title="שיר 2">
                <img src="https://via.placeholder.com/300x140?text=שיר+2" alt="שיר 2">
                <div class="card-body">
                    <h3>שיר 2</h3>
                    <p>מוזיקה מרגשת עם ניגונים מסורתיים.</p>
                    <a href="https://www.youtube.com/watch?v=example2" target="_blank">האזנה</a>
                </div>
            </div>
            <div class="card" data-title="שיר 3">
                <img src="https://via.placeholder.com/300x140?text=שיר+3" alt="שיר 3">
                <div class="card-body">
                    <h3>שיר 3</h3>
                    <p>קצב עליז וקטע קטעי תפילה.</p>
                    <a href="https://www.youtube.com/watch?v=example3" target="_blank">האזנה</a>
                </div>
            </div>
            <div class="card" data-title="שיר 4">
                <img src="https://via.placeholder.com/300x140?text=שיר+4" alt="שיר 4">
                <div class="card-body">
                    <h3>שיר 4</h3>
                    <p>מילים מרגשות ומנגינה נשגבת.</p>
                    <a href="https://www.youtube.com/watch?v=example4" target="_blank">האזנה</a>
                </div>
            </div>
            <div class="card" data-title="שיר 5">
                <img src="https://via.placeholder.com/300x140?text=שיר+5" alt="שיר 5">
                <div class="card-body">
                    <h3>שיר 5</h3>
                    <p>שילוב של קולות קהילתיים ומוזיקה מודרנית.</p>
                    <a href="https://www.youtube.com/watch?v=example5" target="_blank">האזנה</a>
                </div>
            </div>
        </div>
    </div>
    <script>
        const searchInput = document.getElementById('search');
        const cardsContainer = document.getElementById('cards');
        const cards = Array.from(cardsContainer.getElementsByClassName('card'));

        searchInput.addEventListener('input', () => {
            const query = searchInput.value.trim().toLowerCase();
            cards.forEach(card => {
                const title = card.dataset.title.toLowerCase();
                card.style.display = title.includes(query) ? '' : 'none';
            });
        });
    </script>
</body>
</html>
