<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בוט WhatsApp</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #80deea);
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        h1 {
            font-size: 2rem;
            margin: 0.5rem;
        }
        p {
            font-size: 1rem;
            margin: 0.5rem 1rem;
            line-height: 1.5;
        }
        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            background: #25D366;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 0.8rem 1.5rem;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            transition: background .3s;
            margin-top: 1rem;
        }
        .whatsapp-btn:hover {
            background: #1ebe5d;
        }
        .whatsapp-btn svg {
            margin-left: 0.5rem;
        }
        @media (max-width:600px){
            h1{font-size:1.5rem;}
            p{font-size:0.9rem;}
        }
    </style>
</head>
