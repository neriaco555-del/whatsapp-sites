<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בוט WhatsApp</title>
    <style>
        body {
            margin:0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #80deea);
            color:#333;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            min-height:100vh;
            text-align:center;
        }
        h1 {
            font-size:2rem;
            margin:0.5rem;
        }
        p {
            font-size:1rem;
            margin:0.5rem 1rem;
            line-height:1.5;
        }
        .whatsapp-btn {
            display:inline-flex;
            align-items:center;
            background:#25D366;
            color:#fff;
            border:none;
            border-radius:8px;
            padding:0.8rem 1.5rem;
            font-size:1rem;
            cursor:pointer;
            text-decoration:none;
            transition:background .3s;
            margin-top:1rem;
        }
        .whatsapp-btn:hover {
            background:#1ebe5d;
        }
        .whatsapp-btn svg {
            margin-left:0.5rem;
        }
        @media (max-width:600px){
            h1{font-size:1.5rem;}
            p{font-size:0.9rem;}
        }
    </style>
</head>
<body>
    <h1>ברוכים הבאים לבוט ה-WhatsApp שלנו 🤖</h1>
    <p>לחצו על הכפתור למטה כדי להתחיל שיחה ישירה עם השירות שלנו ב-WhatsApp.</p>
    <a href="#" class="whatsapp-btn" id="waLink">
        שלח הודעה
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M20.52 3.48A11.93 11.93 0 0012 0C5.37 0 0 5.37 0 12c0 2.12.55 4.13 1.5 5.88L0 24l6.3-1.64A11.92 11.92 0 0012 24c6.63 0 12-5.37 12-12 0-3.19-1.24-6.09-3.48-8.52zM12 22c-2.34 0-4.53-.66-6.38-1.79l-.45-.27-3.73 1 1-3.66-.31-.5A9.96 9.96 0 012 12c0-5.51 4.49-10 10-10s10 4.49 10 10-4.49 10-10 10zm5.5-7.5c-.23-.12-1.38-.68-1.59-.76-.21-.08-.36-.12-.51.12-.15.24-.58.76-.71.92-.13.15-.26.17-.49.06-.23-.12-1-0.36-1.91-1.15-.71-.63-1.19-1.41-1.33-1.64-.13-.23-.01-.36.11-.48.12-.12.26-.31.38-.46.13-.15.17-.26.26-.43.08-.17.04-.33-.02-.46-.06-.12-.51-1.23-.7-1.68-.18-.44-.36-.38-.51-.38-.15 0-.33-.02-.51-.02-.18 0-.48.07-.73.33-.26.26-.99.97-.99 2.36 0 1.39 1.02 2.73 1.16 2.92.15.19 2 3.05 4.85 4.27.68.29 1.21.46 1.63.59.68.22 1.3.19 1.79.12.55-.08 1.38-.56 1.57-1.1.19-.54.19-1 .14-1.1-.05-.1-.2-.15-.43-.27z"/></svg>
    </a>

    <script>
        // מספר טלפון של הבוט בפורמט בינלאומי ללא סימני + או רווחים
        const phoneNumber = "1234567890"; // שנה למספר האמיתי
        const prefilledMessage = encodeURIComponent("שלום, אני רוצה מידע נוסף");
        const waUrl = `https://wa.me/${phoneNumber}?text=${prefilledMessage}`;

        document.getElementById('waLink').addEventListener('click', function(e){
            e.preventDefault();
            window.open(waUrl, '_blank');
        });
    </script>
</body>
</html>
