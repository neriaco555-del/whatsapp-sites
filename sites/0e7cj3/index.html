<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משחק מקוון</title>
<style>
:root{
  --primary:#4a90e2;
  --bg:#f5f5f5;
  --text:#333;
  --card:#fff;
}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
  direction:rtl;
}
header{
  background:var(--primary);
  color:#fff;
  padding:1rem;
  text-align:center;
  font-size:1.5rem;
}
.main{
  padding:1rem;
  max-width:600px;
  margin:auto;
}
.card{
  background:var(--card);
  border-radius:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
  margin-bottom:1rem;
  overflow:hidden;
}
.card img{
  width:100%;
  display:block;
}
.card-content{
  padding:0.75rem;
}
button{
  background:var(--primary);
  color:#fff;
  border:none;
  padding:0.5rem 1rem;
  border-radius:4px;
  cursor:pointer;
  font-size:1rem;
}
button:active{
  background:#357ab8;
}
footer{
  text-align:center;
  padding:1rem;
  font-size:0.9rem;
  color:#777;
}
@media (max-width:480px){
  header{font-size:1.2rem;}
}
</style>
</head>
<body>
<header>משחק מקוון</header>
<div class="main">
  <div class="card">
    <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAwIiBoZWlnaHQ9IjMwMCIgdmlld0JveD0iMCAwIDYwMCAzMDAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHJlY3Qgd2lkdGg9IjYwMCIgaGVpZ2h0PSIzMDAiIGZpbGw9IiNkZGRkZGQiLz48dGV4dCB4PSIzMDAiIHk9IjE1MCIgZm9udC1zaXplPSIyMCIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iI2NjYyI+תמונת משחק</text></svg>">
    <div class="card-content">
      <h2>שם המשחק</h2>
      <p>תיאור קצר של המשחק. לחצו על הכפתור כדי להתחיל לשחק.</p>
      <button onclick="startGame()">התחל לשחק</button>
    </div>
  </div>
  <div class="card">
    <h3>דירוגים</h3>
    <div class="card-content">
      <p>⭐⭐⭐⭐☆ (4.5/5)</p>
    </div>
  </div>
  <div class="card">
    <h3>הוראות</h3>
    <div class="card-content">
      <ul>
        <li>השתמשו במקשי החצים כדי לנוע.</li>
        <li>הימנעו ממכשולים.</li>
        <li>אספו נקודות כדי לשפר את הציון.</li>
      </ul>
    </div>
  </div>
</div>
<footer>© 2026 משחקים מקוונים</footer>
<script>
function startGame(){
  alert('המשחק מתחיל! (הדגמה בלבד)');
}
</script>
</body>
</html>
