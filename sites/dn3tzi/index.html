<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>אדיט של ביתר ירושלים</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    body{
        font-family:Arial,Helvetica,sans-serif;
        margin:0;
        padding:0;
        background:#f5f5f5;
        color:#333;
    }
    header{
        background:#006400;
        color:#fff;
        text-align:center;
        padding:1rem 0;
        font-size:1.5rem;
    }
    main{
        max-width:600px;
        margin:1rem auto;
        padding:1rem;
        background:#fff;
        border-radius:8px;
        box-shadow:0 2px 8px rgba(0,0,0,0.1);
    }
    label{
        display:block;
        margin-top:0.8rem;
        font-weight:bold;
    }
    input, textarea{
        width:100%;
        padding:0.5rem;
        margin-top:0.3rem;
        border:1px solid #ccc;
        border-radius:4px;
        font-size:1rem;
        box-sizing:border-box;
    }
    textarea{
        resize:vertical;
        min-height:80px;
    }
    button{
        margin-top:1rem;
        width:100%;
        padding:0.7rem;
        background:#006400;
        color:#fff;
        border:none;
        border-radius:4px;
        font-size:1rem;
        cursor:pointer;
    }
    button:hover{
        background:#004d00;
    }
    .msg{
        margin-top:1rem;
        padding:0.5rem;
        border-radius:4px;
        display:none;
    }
    .msg.success{background:#d4edda;color:#155724;}
    .msg.error{background:#f8d7da;color:#721c24;}
</style>
</head>
<body>
<header>אדיט של ביתר ירושלים</header>
<main>
    <form id="editForm">
        <label for="teamName">שם הקבוצה</label>
        <input type="text" id="teamName" placeholder="לדוגמה: ביתר ירושלים" required>

        <label for="description">תיאור</label>
        <textarea id="description" placeholder="הוסף תיאור קצר..." required></textarea>

        <label for="logoUrl">כתובת תמונת הלוגו</label>
        <input type="url" id="logoUrl" placeholder="https://example.com/logo.png">

        <button type="submit">שמור שינוי</button>
        <div class="msg success" id="successMsg">הנתונים נשמרו בהצלחה! 🎉</div>
        <div class="msg error" id="errorMsg">שגיאה: יש למלא את כל השדות החובה.</div>
    </form>
</main>
<script>
document.getElementById('editForm').addEventListener('submit',function(e){
    e.preventDefault();
    const name=document.getElementById('teamName').value.trim();
    const desc=document.getElementById('description').value.trim();
    const logo=document.getElementById('logoUrl').value.trim();
    if(!name||!desc){
        showMsg('error');
        return;
    }
    // כאן ניתן להוסיף שליחה לשרת, כרגע מדפיס לקונסול
    console.log({name,desc,logo});
    showMsg('success');
    // נקה את הטופס
    this.reset();
});
function showMsg(type){
    const success=document.getElementById('successMsg');
    const error=document.getElementById('errorMsg');
    if(type==='success'){
        success.style.display='block';
        error.style.display='none';
    }else{
        success.style.display='none';
        error.style.display='block';
    }
}
</script>
</body>
</html>
